services:

  app:
    build: .
    container_name: code-runner

    ports:
      - "3000:3000"

    depends_on:
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres-db

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: